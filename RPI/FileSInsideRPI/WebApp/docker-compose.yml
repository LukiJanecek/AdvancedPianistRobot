services:
  backend:
    build:
      context: ./backend
    container_name: pianist-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - /tmp/led:/tmp/led
    entrypoint:
      - /bin/bash
      - -c
      - |
          # zajisti existenci adresáře
          mkdir -p /tmp/led

          # DATA FIFO
          if [ ! -p /tmp/led/pipe ]; then
            mkfifo -m 666 /tmp/led/pipe
            echo "[ENTRYPOINT] Vytvářím FIFO /tmp/led/pipe"
          else
            echo "[ENTRYPOINT] FIFO /tmp/led/pipe už existuje"
          fi

          # ACK FIFO
          if [ ! -p /tmp/led/ack_pipe ]; then
            mkfifo -m 666 /tmp/led/ack_pipe
            echo "[ENTRYPOINT] Vytvářím FIFO /tmp/led/ack_pipe"
          else
            echo "[ENTRYPOINT] FIFO /tmp/led/ack_pipe už existuje"
          fi

          echo "[ENTRYPOINT] Startuju uvicorn..."
          exec uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      # uvnitř kontejneru nehardcoduj 192.168.x.x, ale localhost
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 5

  expo-frontend:
    build:
      context: ./frontend
    container_name: pianist-frontend
    ports:
      - "80:80"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
