services:
  backend:
    build:
      context: ./backend
    container_name: pianist-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - /tmp/led:/tmp/led
    entrypoint:
      - /bin/bash
      - -c
      - |
          if [ ! -p /tmp/led/pipe ]; then
            mkfifo -m 666 /tmp/led/pipe;
            echo "[ENTRYPOINT] Vytvářím FIFO /tmp/led/pipe";
          else
            echo "[ENTRYPOINT] FIFO /tmp/led/pipe už existuje";
          fi

          echo "[ENTRYPOINT] Startuju uvicorn..."
          exec uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://192.168.1.104:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 5

  expo-frontend:
    build:
      context: ./frontend
    container_name: pianist-frontend
    ports:
      - "80:80"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
